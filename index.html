<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Iconos: generados por `npm run images` (ver public/) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F5FC" />

    <title>Manualidades Lua | Catálogo de amigurumis, eventos, flores y llaveros 🧶</title>
    <meta
      name="description"
      content="Catálogo interactivo de Manualidades Lua: amigurumis, recuerdos para eventos, ramos de flores y llaveros miniatura, hechos a mano. Cotiza por WhatsApp."
    />
    <meta name="author" content="Manualidades Lua" />

    <!-- Canonical: %SITE_URL% lo reemplaza el plugin de vite.config.js con la
         URL real definida en VITE_SITE_URL (con barra final incluida). -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manualidades Lua" />
    <meta property="og:title" content="Manualidades Lua" />
    <meta
      property="og:description"
      content="Amigurumis, recuerdos para eventos, flores y llaveros, tejidos a mano 🧶. Cotiza por WhatsApp."
    />
    <!-- Las imagenes de Open Graph deben ser URLs ABSOLUTAS: con rutas relativas
         ni Facebook ni WhatsApp las llegan a resolver. -->
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Catálogo de Manualidades Lua: amigurumis, flores y llaveros hechos a mano" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manualidades Lua" />
    <meta
      name="twitter:description"
      content="Amigurumis, recuerdos para eventos, flores y llaveros, tejidos a mano 🧶."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <!-- Datos estructurados (Organization + WebSite + ItemList del catalogo).
         Los genera scripts en vite.config.js a partir de src/data/products.json. -->
    %CATALOG_JSON_LD%

    <!-- Tipografías: Fraunces (artesanal/elegante) + Inter (limpia)
         Fraunces se pide con el eje `opsz` libre (mejora el titulo grande del
         hero) pero con el peso FIJO en 600, que es el unico que usa el sitio
         como `font-semibold`. Servir el rango 400-700 entero costaba 77 kB y
         esto 42 kB (latin + latin-ext). Si anades titulos en otro peso, subelo
         aqui y revisa que `index.css` siga aplicando `font-semibold` a h1-h3. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
